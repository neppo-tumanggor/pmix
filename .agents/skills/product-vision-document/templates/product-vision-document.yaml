schema: product-vision/v1

product:
  name: "{{Product Name}}"
  template_title: "Product Vision Template"
  version: "{{Version}}"

document_information:
  project: "{{Project Name}}"
  document: "Product Vision"
  version: "{{Version}}"
  status: "{{Draft/Review/Approved}}"
  classification: "{{Internal/Public}}"
  owner: "{{Owner}}"

vision_statement:
  description: "{{Describe the long-term vision of the product. Replace all references to the specific product with your own. Explain purpose, strategic direction, future capabilities, engineering philosophy, and long-term ambition.}}"
  required_topics:
    - purpose
    - strategic direction
    - future capabilities
    - engineering philosophy
    - long-term ambition

mission:
  description: "{{Describe the mission, what the team is building, who it serves, and engineering commitments.}}"
  required_topics:
    - what the team is building
    - who it serves
    - engineering commitments

problem_statement:
  description: "{{Describe the business and user problems, current limitations, and why this product exists.}}"
  required_topics:
    - business problems
    - user problems
    - current limitations
    - why this product exists

target_users:
  primary_users:
    - id: individual_users
      label: "Individual Users"
      description: "{{...}}"
    - id: teams_and_communities
      label: "Teams and Communities"
      description: "{{...}}"
    - id: businesses
      label: "Businesses"
      description: "{{...}}"
  secondary_users:
    - id: developers
      label: "Developers"
      description: "{{...}}"
    - id: system_administrators
      label: "System Administrators"
      description: "{{...}}"
    - id: product_teams
      label: "Product Teams"
      description: "{{...}}"
  enterprise_users:
    - id: large_organizations
      label: "Large Organizations"
      description: "{{...}}"
    - id: platform_operators
      label: "Platform Operators"
      description: "{{...}}"
    - id: ai_and_automation_integrators
      label: "AI & Automation Integrators"
      description: "{{...}}"

user_prioritization:
  priorities:
    - rank: 1
      description: "{{Priority 1}}"
    - rank: 2
      description: "{{Priority 2}}"
    - rank: 3
      description: "{{Priority 3}}"
  rollout_strategy: "{{Explain rollout strategy while keeping future architecture in mind.}}"

value_proposition:
  overall: "{{Overall value proposition}}"
  core_value_propositions:
    - id: reliable_real_time_experience
      label: "Reliable Real-Time Experience"
      description: "{{...}}"
    - id: privacy_and_security_by_design
      label: "Privacy & Security by Design"
      description: "{{...}}"
    - id: built_for_scale
      label: "Built for Scale"
      description: "{{...}}"
    - id: extensible_platform
      label: "Extensible Platform"
      description: "{{...}}"
    - id: engineering_foundation
      label: "Engineering Foundation"
      description: "{{...}}"
    - id: operational_excellence
      label: "Operational Excellence"
      description: "{{...}}"
  customer_value:
    - id: end_users
      label: "End Users"
      description: "{{...}}"
    - id: organizations
      label: "Organizations"
      description: "{{...}}"
    - id: developers
      label: "Developers"
      description: "{{...}}"
  unique_positioning: "{{How is this product differentiated?}}"

